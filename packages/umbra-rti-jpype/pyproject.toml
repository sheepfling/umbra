[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "umbra-rti-jpype"
version = "0.1.0"
description = "Optional JPype provider for Java IEEE 1516.1-2025 RTIs"
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Umbra contributors" }]
dependencies = ["hla-rti-api==0.1.0"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[project.optional-dependencies]
jpype = ["JPype1>=1.5"]

[project.entry-points."hla.rti1516_2025.factories"]
java = "umbra._java.rti1516_2025:JavaRtiFactory"

[tool.hatch.build.targets.wheel]
packages = ["src/umbra"]
