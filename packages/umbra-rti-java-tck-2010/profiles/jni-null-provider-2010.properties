# Capability declaration for the repository's JNI ABI/null-provider scaffold.
#
# This provider exists only to prove the Java/JNI boundary. Its bounded
# connection lifecycle and standard encoder-carrier slices are available; all
# other RTI ambassador services still throw RTIinternalError. Keep the
# broader ambassador-factory scenario unsupported because it also requires
# handle, collection, and logical-time factory methods on RTIambassador.

