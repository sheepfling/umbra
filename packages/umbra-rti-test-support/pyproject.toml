[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "umbra-rti-test-support"
version = "0.1.0"
description = "Shared provider conformance tests for the Umbra Python RTI bindings"
readme = "README.md"
requires-python = ">=3.11"
authors = [{ name = "Umbra contributors" }]
dependencies = ["hla-rti-api==0.1.0"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
]

[tool.hatch.build.targets.wheel]
packages = ["src/umbra_rti_test_support"]
